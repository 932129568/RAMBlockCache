<!--
  设计系统：Linear（骨架）+ Tech Utility（视觉方向）· 深色
  令牌唯一来源：deliverables/design/02-design-system.md（v1.0）+ 02b-charts-motion.md（v1.1 增补）
  原型：Phase 3b · 整体重构 V2.0 · 原型构建师 筑原型（Zhu）
  说明：单文件自包含，无任何外部依赖（不引 CDN；图表全部内联 SVG + CSS/JS 手绘，不用 canvas 库）。
        所有数值为演示用真实感示例，非编造统计结论。统计不可用一律显示「—」，禁止 0。
  v2 变更：整体 UI 重构（自解释导航 + 页面副标题 + bento 数据卡）；7 类真实数据图；11 类特效；

<style>
/* ════════════════════════════════════════════════════════════
   设计令牌（逐值取自 02-design-system.md §B / §G.3 快速令牌块）
   ════════════════════════════════════════════════════════════ */
:root{
  /* 背景层级 */
  --rbc-bg-app:#0E0E11; --rbc-bg-sidebar:#121216; --rbc-bg-statusbar:#14141A;
  --rbc-bg-surface:#17171C; --rbc-bg-surface-hover:#1E1E24; --rbc-bg-elevated:#22222A;
  --rbc-bg-input:#1B1B21; --rbc-bg-skeleton:#1B1B21;
  --rbc-border-subtle:#23232B; --rbc-border-default:#2C2C35; --rbc-border-strong:#3A3A45;
  --rbc-scrim:rgba(0,0,0,.62);
  /* 文字 */
  --rbc-text-primary:#EDEDF2; --rbc-text-secondary:#9A9AA5; --rbc-text-tertiary:#6B6B76;
  --rbc-text-disabled:#4A4A54; --rbc-text-on-accent:#06222E;
  /* 强调 */
  --rbc-accent:#4CC2FF; --rbc-accent-hover:#6FD0FF; --rbc-accent-active:#2AA8E8;
  --rbc-accent-subtle:#0A2636; --rbc-focus-ring:rgba(76,194,255,.45);
  /* 语义 */
  --rbc-success-fg:#63D6A0; --rbc-success-bg:#0E2A20; --rbc-success-border:#1E5C46; --rbc-success-solid:#1F8F63;
  --rbc-warning-fg:#F2B84B; --rbc-warning-bg:#2E2109; --rbc-warning-border:#7A5310; --rbc-warning-solid:#B07C18;
  --rbc-danger-fg:#F27A72;  --rbc-danger-bg:#331312;  --rbc-danger-border:#8A2A26;  --rbc-danger-solid:#B3382F; --rbc-danger-solid-hover:#C6453B;
  --rbc-info-fg:#6FB4F5;    --rbc-info-bg:#0C2138;    --rbc-info-border:#1E4E80;    --rbc-info-solid:#2E6DB4;
  --rbc-neutral-fg:#A6A6B0; --rbc-neutral-bg:#1C1C22; --rbc-neutral-border:#3A3A45;
  /* 图表专用色（02b §A.2 · 仅 2 色系：数据系青蓝 + 语义系绿/琥珀/红） */
  --chart-1:#4CC2FF; --chart-2:#2E86D6;
  --chart-grid:#23232B; --chart-axis-text:#6B6B76;
  --chart-area-fill:rgba(76,194,255,.12); --chart-track:#23232B;
  --chart-heat-1:#1E3A4D; --chart-heat-2:#2E86D6; --chart-heat-3:#4CC2FF;
  --chart-ok:#63D6A0; --chart-warn:#F2B84B; --chart-danger:#F27A72; --chart-neutral:#A6A6B0;
  /* 字体 */
  --rbc-font-ui:"Segoe UI Variable Text","Segoe UI","Microsoft YaHei UI","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  --rbc-font-display:"Segoe UI Variable Display","Segoe UI Semibold","Microsoft YaHei UI","Microsoft YaHei",sans-serif;
  --rbc-font-mono:"Cascadia Mono","Consolas","JetBrains Mono","SF Mono","Courier New",monospace;
  /* 间距 / 圆角 */
  --rbc-space-1:4px; --rbc-space-2:8px; --rbc-space-3:12px; --rbc-space-4:16px;
  --rbc-space-5:24px; --rbc-space-6:32px; --rbc-space-7:48px;
  --rbc-radius-xs:4px; --rbc-radius-sm:6px; --rbc-radius-md:10px; --rbc-radius-lg:14px; --rbc-radius-pill:999px;
  --rbc-shadow-raised:0 1px 2px rgba(0,0,0,.4);
  --rbc-shadow-floating:0 8px 24px rgba(0,0,0,.55);
  --rbc-shadow-overlay:0 16px 48px rgba(0,0,0,.65);
  --rbc-sidebar-w:216px; --rbc-statusbar-h:40px; --rbc-content-pad:20px;
  /* 动效令牌（02b §B.1 · 5 档时长 + 4 条曲线） */
  --dur-instant:90ms; --dur-fast:120ms; --dur-base:180ms; --dur-slow:240ms; --dur-slower:480ms;
  --ease-standard:cubic-bezier(.2,0,0,1); --ease-out:cubic-bezier(.16,1,.3,1);
  --ease-in:cubic-bezier(.4,0,1,1); --ease-linear:linear;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--rbc-bg-app);                 /* NH-2 修正：不再使用越界色 #08080A */
  color:var(--rbc-text-primary);
  font:400 13px/1.6 var(--rbc-font-ui);
  display:flex;align-items:center;justify-content:center;
  padding:20px;min-height:100%;
  -webkit-font-smoothing:antialiased;
}
.num{font-family:var(--rbc-font-mono);font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.mono{font-family:var(--rbc-font-mono)}

/* ═══════════ 桌面窗口框架（1180×760 · NH-3） ═══════════ */
.win{
  width:1180px;height:760px;flex:none;
  background:var(--rbc-bg-app);
  border:1px solid var(--rbc-border-strong);
  border-radius:var(--rbc-radius-md);overflow:hidden;
  display:flex;flex-direction:column;
  box-shadow:0 24px 70px rgba(0,0,0,.72);
  position:relative;
}
.titlebar{
  height:34px;flex:none;display:flex;align-items:center;gap:8px;
  padding:0 6px 0 12px;background:var(--rbc-bg-sidebar);border-bottom:1px solid var(--rbc-border-subtle);  /* NH-2 修正：改用令牌色 */
  user-select:none;
}
.titlebar .ico{width:16px;height:16px;flex:none;display:block}
.titlebar .ttl{font-size:12px;color:var(--rbc-text-secondary);font-weight:600;letter-spacing:.2px}
.titlebar .ttl b{color:var(--rbc-text-primary)}
.titlebar .wctrl{margin-left:auto;display:flex;height:34px}
.titlebar .wctrl span{width:44px;height:34px;display:flex;align-items:center;justify-content:center;color:var(--rbc-text-secondary);transition:background var(--dur-fast) var(--ease-standard),color var(--dur-fast) var(--ease-standard)}
.titlebar .wctrl span:hover{background:var(--rbc-bg-surface-hover);color:var(--rbc-text-primary)}
.titlebar .wctrl span.close:hover{background:var(--rbc-danger-solid);color:#fff}

/* ═══════════ 顶部常驻四段状态条 ═══════════ */
.statusbar{
  height:var(--rbc-statusbar-h);flex:none;display:flex;align-items:center;gap:10px;
  padding:0 16px;background:var(--rbc-bg-statusbar);
  border-bottom:1px solid var(--rbc-border-subtle);overflow:hidden;
}
.seg{
  display:inline-flex;align-items:center;gap:8px;flex:none;
  border:1px solid var(--rbc-border-default);border-radius:var(--rbc-radius-pill);
  padding:4px 12px;font-size:12px;color:var(--rbc-text-secondary);
  background:transparent;font-family:inherit;cursor:default;
  transition:background var(--dur-base) var(--ease-standard),border-color var(--dur-base) var(--ease-standard),color var(--dur-base) var(--ease-standard);
}
.seg .dot{width:8px;height:8px;border-radius:50%;background:var(--rbc-neutral-fg);flex:none;transition:background var(--dur-base) var(--ease-standard)}
.seg .nm{color:var(--rbc-text-tertiary)}
.seg b{font-weight:600;color:var(--rbc-text-primary)}
.seg.ok{border-color:var(--rbc-success-border);background:var(--rbc-success-bg)}
.seg.ok .dot{background:var(--rbc-success-fg)} .seg.ok b{color:var(--rbc-success-fg)}
.seg.warn{border-color:var(--rbc-warning-border);background:var(--rbc-warning-bg)}
.seg.warn .dot{background:var(--rbc-warning-fg)} .seg.warn b{color:var(--rbc-warning-fg)}
.seg.bad{border-color:var(--rbc-danger-border);background:var(--rbc-danger-bg)}
.seg.bad .dot{background:var(--rbc-danger-fg)} .seg.bad b{color:var(--rbc-danger-fg)}
.seg.mut{border-color:var(--rbc-neutral-border);background:var(--rbc-neutral-bg)}
.seg.mut .dot{background:var(--rbc-neutral-fg)} .seg.mut b{color:var(--rbc-neutral-fg)}
.seg.click{cursor:pointer}
.seg.click:hover{background:var(--rbc-bg-surface-hover)}
.seg.click:focus-visible{outline:2px solid var(--rbc-focus-ring);outline-offset:1px}
.statusbar .reconnect{margin-left:auto;font-size:11px;color:var(--rbc-warning-fg);display:flex;align-items:center;gap:6px}
.statusbar .reconnect .dot{width:8px;height:8px;border-radius:50%;background:var(--rbc-warning-fg);display:inline-block;animation:pulse 1200ms var(--ease-standard) infinite}

/* ═══════════ 主体 ═══════════ */
.main{flex:1;display:flex;min-height:0}
.sidebar{
  width:var(--rbc-sidebar-w);flex:none;background:var(--rbc-bg-sidebar);
  border-right:1px solid var(--rbc-border-subtle);display:flex;flex-direction:column;min-height:0;
}
.brand{padding:16px 16px 10px}
.brand .nm{font-size:15px;font-weight:600;letter-spacing:.2px;display:flex;align-items:center;gap:8px}
.brand .ver{font-size:11px;color:var(--rbc-text-tertiary);margin-top:4px}
.nav{padding:4px 10px;overflow-y:auto;flex:1}
.nav .sec{font-size:11px;color:var(--rbc-text-tertiary);padding:12px 12px 6px;font-weight:600;letter-spacing:.4px}
/* 自解释导航：图标 + 标签 + 一行说明 */
.nav button.nv{
  width:100%;text-align:left;background:transparent;border:0;border-radius:var(--rbc-radius-sm);
  color:var(--rbc-text-secondary);padding:8px 10px;font:400 13px/1.4 var(--rbc-font-ui);
  cursor:pointer;margin-bottom:3px;display:grid;grid-template-columns:18px 1fr auto;align-items:center;gap:10px;
  transition:background var(--dur-fast) var(--ease-standard),color var(--dur-fast) var(--ease-standard);
}
.nav button.nv .nvico{width:18px;height:18px;color:var(--rbc-text-tertiary);transition:color var(--dur-fast) var(--ease-standard)}
.nav button.nv .nvtxt{min-width:0}
.nav button.nv .nvtxt .nvl{display:block;font-weight:600;color:inherit}
.nav button.nv .nvtxt .nvd{display:block;font-size:11px;color:var(--rbc-text-tertiary);line-height:1.35;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav button.nv:hover{background:var(--rbc-bg-surface-hover);color:var(--rbc-text-primary)}
.nav button.nv:hover .nvico{color:var(--rbc-text-secondary)}
.nav button.nv.on{background:var(--rbc-accent-subtle);color:var(--rbc-text-primary);box-shadow:inset 2px 0 0 var(--rbc-accent)}
.nav button.nv.on .nvico{color:var(--rbc-accent)}
.nav button.nv.on .nvtxt .nvd{color:var(--rbc-text-secondary)}
.nav button.nv .ndot{width:6px;height:6px;border-radius:50%;background:transparent;flex:none}
.nav button.nv .ndot.alert{background:var(--rbc-danger-fg)}
.nav button.nv .ndot.warn{background:var(--rbc-warning-fg)}
.side-foot{border-top:1px solid var(--rbc-border-subtle);padding:10px 12px;flex:none}
.side-foot .lbl{font-size:11px;color:var(--rbc-text-tertiary);margin-bottom:6px}
.demo-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.demo-grid button{
  background:var(--rbc-bg-input);border:1px solid var(--rbc-border-default);border-radius:var(--rbc-radius-xs);
  color:var(--rbc-text-secondary);font:400 11px/1.3 var(--rbc-font-ui);padding:5px 6px;cursor:pointer;text-align:center;
  transition:background var(--dur-fast) var(--ease-standard),color var(--dur-fast) var(--ease-standard),border-color var(--dur-fast) var(--ease-standard);
}
.demo-grid button:hover{background:var(--rbc-bg-surface-hover);color:var(--rbc-text-primary)}
.demo-grid button.on{border-color:var(--rbc-accent);color:var(--rbc-accent)}

/* ═══════════ 内容区 ═══════════ */
.content{flex:1;min-width:0;overflow-y:auto;padding:var(--rbc-content-pad) var(--rbc-content-pad) 40px}
/* 页面切换：淡入 + 8px 位移（240ms --ease-out，仅 transform/opacity） */
.page-enter{animation:pageEnter var(--dur-slow) var(--ease-out) both}
@keyframes pageEnter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.page-head{display:flex;align-items:flex-start;gap:16px;margin-bottom:16px}
.page-head h1{font:600 20px/1.3 var(--rbc-font-display)}
.page-head .sub{font-size:12px;color:var(--rbc-text-secondary);margin-top:4px;display:flex;align-items:center;gap:6px}
.page-head .sub svg{color:var(--rbc-text-tertiary);flex:none}
.page-head .headact{margin-left:auto;display:flex;gap:8px;align-items:center;flex:none}
h2.sec{font:600 14px/1.4 var(--rbc-font-ui);margin:24px 0 10px;display:flex;align-items:center;gap:10px}
h2.sec .hint-inline{font:400 11px/1 var(--rbc-font-ui);color:var(--rbc-text-tertiary)}
h3.sub{font:600 13px/1.4 var(--rbc-font-ui);margin:0 0 8px}

/* ── 数据卡（bento）── */
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.dcard{
  background:var(--rbc-bg-surface);border:1px solid var(--rbc-border-subtle);border-radius:var(--rbc-radius-md);
  padding:16px 18px;position:relative;
  transition:transform var(--dur-fast) var(--ease-standard),background var(--dur-fast) var(--ease-standard),border-color var(--dur-fast) var(--ease-standard);
}
.dcard.hov:hover{transform:translateY(-1px);background:var(--rbc-bg-surface-hover);border-color:var(--rbc-border-default)}  /* 卡片 hover 抬升 1px（02b §B.2） */
.dcard .k{font-size:12px;color:var(--rbc-text-secondary);display:flex;align-items:center;gap:8px}
.dcard .vrow{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-top:8px}
.dcard .v{font:600 32px/1.15 var(--rbc-font-mono);font-variant-numeric:tabular-nums;letter-spacing:-.5px;color:var(--rbc-text-primary)}
.dcard .v .u{font-size:13px;color:var(--rbc-text-tertiary);margin-left:4px;font-weight:400}
.dcard .s{font-size:11px;color:var(--rbc-text-tertiary);margin-top:6px}
.dcard .flag{position:absolute;top:12px;right:12px}
.dcard.unavail .v{color:var(--rbc-text-tertiary)}
.dcard.unavail .s{color:var(--rbc-warning-fg)}
.dcard .spark{margin-top:8px;height:28px}

/* ── 徽标 ── */
.badge{
  display:inline-flex;align-items:center;gap:6px;height:22px;padding:3px 10px;border-radius:var(--rbc-radius-pill);
  font:600 12px/1 var(--rbc-font-ui);border:1px solid;white-space:nowrap;position:relative;
  transition:background var(--dur-base) var(--ease-standard),border-color var(--dur-base) var(--ease-standard),color var(--dur-base) var(--ease-standard);
}
.badge .dot{width:6px;height:6px;border-radius:50%}
.bd-green{color:var(--rbc-success-fg);background:var(--rbc-success-bg);border-color:var(--rbc-success-border)}
.bd-green .dot{background:var(--rbc-success-fg)}
.bd-blue{color:var(--rbc-info-fg);background:var(--rbc-info-bg);border-color:var(--rbc-info-border)}
.bd-blue .dot{background:var(--rbc-info-fg)}
.bd-amber{color:var(--rbc-warning-fg);background:var(--rbc-warning-bg);border-color:var(--rbc-warning-border)}
.bd-amber .dot{background:var(--rbc-warning-fg)}
.bd-red{color:var(--rbc-danger-fg);background:var(--rbc-danger-bg);border-color:var(--rbc-danger-border)}
.bd-red .dot{background:var(--rbc-danger-fg)}
.bd-gray{color:var(--rbc-neutral-fg);background:var(--rbc-neutral-bg);border-color:var(--rbc-neutral-border)}
.bd-gray .dot{background:var(--rbc-neutral-fg)}
/* 回写双语义：绿主体 + 右上角琥珀角标（6px · NH-4 修正） */
.badge.corner::after{content:"";position:absolute;top:-2px;right:-2px;width:6px;height:6px;border-radius:50%;background:var(--rbc-warning-fg);border:2px solid var(--rbc-bg-app)}
/* 自愈中 / 重连中呼吸圆点（1200ms ≤2s · 02b §B.3-2） */
.badge.healing .dot{animation:pulse 1200ms var(--ease-standard) infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}

/* ── 卷卡 ── */
.vcard{
  background:var(--rbc-bg-surface);border:1px solid var(--rbc-border-subtle);border-radius:var(--rbc-radius-md);
  padding:14px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:10px;
  transition:transform var(--dur-fast) var(--ease-standard),background var(--dur-fast) var(--ease-standard),border-color var(--dur-fast) var(--ease-standard);
}
.vcard.hov:hover{transform:translateY(-1px);border-color:var(--rbc-border-default);background:var(--rbc-bg-surface-hover)}
.vcard .vid{font:600 16px/1.2 var(--rbc-font-display);min-width:44px}
.vcard .vinfo{min-width:120px}
.vcard .vinfo .lbl{font-size:13px;color:var(--rbc-text-primary)}
.vcard .vinfo .cap{font-size:11px;color:var(--rbc-text-tertiary);font-family:var(--rbc-font-mono)}
.vcard .vstate{display:flex;align-items:center;gap:10px}
.vcard .vmode{font-size:12px;color:var(--rbc-text-secondary);display:flex;align-items:center;gap:6px}
.vcard .acts{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.vcard .why{width:100%;font-size:11px;color:var(--rbc-text-tertiary);padding-left:2px}
.vcard .why.ok{color:var(--rbc-success-fg)}
.vcard.dim{opacity:.72}

/* ── 按钮 ── */
.btn{
  height:32px;padding:0 12px;border-radius:var(--rbc-radius-sm);border:1px solid var(--rbc-border-default);
  background:transparent;color:var(--rbc-text-primary);font:600 13px/1 var(--rbc-font-ui);cursor:pointer;
  display:inline-flex;align-items:center;gap:8px;white-space:nowrap;
  transition:background var(--dur-fast) var(--ease-standard),border-color var(--dur-fast) var(--ease-standard),transform var(--dur-instant) var(--ease-standard);
}
.btn:hover{background:var(--rbc-bg-surface-hover)}
.btn:active{transform:translateY(1px)}   /* 按钮按下位移 1px（02b §B.3-4） */
.btn:focus-visible{outline:2px solid var(--rbc-focus-ring);outline-offset:1px}
.btn.pri{background:var(--rbc-accent);border-color:var(--rbc-accent);color:var(--rbc-text-on-accent)}
.btn.pri:hover{background:var(--rbc-accent-hover);border-color:var(--rbc-accent-hover)}
.btn.pri:active{background:var(--rbc-accent-active)}
.btn.danger{background:var(--rbc-danger-solid);border-color:var(--rbc-danger-solid);color:#fff}
.btn.danger:hover{background:var(--rbc-danger-solid-hover);border-color:var(--rbc-danger-solid-hover)}
.btn.ghost{border-color:transparent;height:28px;padding:0 10px;color:var(--rbc-text-secondary);font-weight:400}
.btn.ghost:hover{background:var(--rbc-bg-input);color:var(--rbc-text-primary)}
.btn.sm{height:28px;font-size:12px;padding:0 10px}
.btn:disabled{background:var(--rbc-bg-input);border-color:var(--rbc-border-subtle);color:var(--rbc-text-disabled);cursor:not-allowed}
.btn:disabled:hover{background:var(--rbc-bg-input)}
.btn:disabled:active{transform:none}

/* ── 下拉 ── */
.sel{
  height:30px;padding:0 28px 0 10px;border-radius:var(--rbc-radius-sm);background:var(--rbc-bg-input);
  border:1px solid var(--rbc-border-default);color:var(--rbc-text-primary);font:400 13px/1 var(--rbc-font-ui);
  cursor:pointer;appearance:none;
}
.selwrap{position:relative;display:inline-flex;align-items:center}
.selwrap .selcaret{position:absolute;right:9px;pointer-events:none;color:var(--rbc-text-secondary);flex:none}
.sel:focus-visible{outline:2px solid var(--rbc-focus-ring);outline-offset:1px}
.sel:disabled{color:var(--rbc-text-disabled);cursor:not-allowed}

/* ── 开关 ── */
.sw{width:36px;height:20px;border-radius:var(--rbc-radius-pill);background:var(--rbc-border-default);position:relative;flex:none;border:0;cursor:pointer;transition:background var(--dur-base) var(--ease-standard)}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--rbc-text-secondary);transition:transform var(--dur-base) var(--ease-standard),background var(--dur-base) var(--ease-standard)}
.sw.on{background:var(--rbc-success-solid)}
.sw.on::after{transform:translateX(16px);background:#fff}
.sw.busy{background:var(--rbc-warning-solid)}
.sw.busy::after{animation:swbusy 1200ms var(--ease-standard) infinite}
@keyframes swbusy{0%,100%{opacity:1}50%{opacity:.4}}
.sw:disabled{opacity:.4;cursor:not-allowed}
.sw:focus-visible{outline:2px solid var(--rbc-focus-ring);outline-offset:2px}

/* ── 异常卡 / 三段式 ── */
.alert{border-radius:var(--rbc-radius-md);padding:14px 16px;margin-bottom:12px;border:1px solid;position:relative;overflow:hidden;transition:background var(--dur-base) var(--ease-standard),border-color var(--dur-base) var(--ease-standard)}
.alert::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px}
.alert .at{font:600 14px/1.4 var(--rbc-font-ui);margin-bottom:4px;display:flex;align-items:center;gap:8px}
.alert .ar{font-size:13px;color:var(--rbc-text-secondary);line-height:1.6}
.alert .aa{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
.alert .meta{margin-top:10px;font:400 11px/1.5 var(--rbc-font-mono);color:var(--rbc-text-tertiary);display:flex;gap:14px;flex-wrap:wrap}
.alert.danger{background:var(--rbc-danger-bg);border-color:var(--rbc-danger-border)}
.alert.danger::before{background:var(--rbc-danger-fg)}
.alert.danger .at{color:var(--rbc-danger-fg)}
.alert.warn{background:var(--rbc-warning-bg);border-color:var(--rbc-warning-border)}
.alert.warn::before{background:var(--rbc-warning-fg)}
.alert.warn .at{color:var(--rbc-warning-fg)}
.alert.info{background:var(--rbc-accent-subtle);border-color:var(--rbc-info-border)}
.alert.info::before{background:var(--rbc-info-fg)}
.alert.info .at{color:var(--rbc-info-fg)}

/* ── 进度条 ── */
.prog{height:6px;border-radius:var(--rbc-radius-pill);background:var(--rbc-bg-input);overflow:hidden;margin:10px 0;position:relative}
.prog .fill{height:100%;background:var(--rbc-success-solid);border-radius:inherit;transform-origin:left center;transition:transform var(--dur-base) var(--ease-standard)}
.prog.indet .fill{width:40%;animation:indet 1200ms var(--ease-standard) infinite}
@keyframes indet{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
.prog .lbl{font-size:11px;color:var(--rbc-text-secondary)}

/* ── 表格 ── */
table.tb{width:100%;border-collapse:collapse;font-size:13px}
table.tb th{font:600 11px/1 var(--rbc-font-ui);color:var(--rbc-text-secondary);text-align:left;height:32px;border-bottom:1px solid var(--rbc-border-subtle);letter-spacing:.3px}
table.tb td{height:36px;border-bottom:1px solid var(--rbc-border-subtle);vertical-align:middle;color:var(--rbc-text-primary)}
table.tb td.n,table.tb th.n{text-align:right;font-family:var(--rbc-font-mono);font-variant-numeric:tabular-nums}
table.tb tr:hover td{background:var(--rbc-bg-surface)}
table.tb .ev{color:var(--rbc-text-tertiary);font-size:11px;font-family:var(--rbc-font-mono)}

/* ── 空态 / 加载态 ── */
.empty{text-align:center;padding:48px 20px;color:var(--rbc-text-secondary)}
.empty svg{margin-bottom:14px;color:var(--rbc-text-tertiary)}
.empty .et{font:600 14px/1.4 var(--rbc-font-ui);color:var(--rbc-text-primary);margin-bottom:6px}
.empty .es{font-size:12px;color:var(--rbc-text-secondary);margin-bottom:16px}
/* 骨架 shimmer：单色低对比扫光（02b §B.3-8） */
.skel{background:var(--rbc-bg-skeleton);border-radius:var(--rbc-radius-sm);position:relative;overflow:hidden}
.skel::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,#26262E,transparent);background-size:200% 100%;animation:shimmer 1400ms var(--ease-linear) infinite}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.skel.line{height:12px;margin-bottom:10px}
.skel.block{height:72px;border-radius:var(--rbc-radius-md);margin-bottom:12px}

/* ── IOCTL 通道健康 ── */
.panel{background:var(--rbc-bg-surface);border:1px solid var(--rbc-border-subtle);border-radius:var(--rbc-radius-md);overflow:hidden}
.panel .ph{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--rbc-border-subtle);flex-wrap:wrap}
.panel .ph .pt{font:600 14px/1.4 var(--rbc-font-ui)}
.panel .ph .ps{font-size:11px;color:var(--rbc-text-tertiary)}
.legend{margin-left:auto;display:flex;gap:12px;font-size:11px;color:var(--rbc-text-secondary);flex-wrap:wrap}
.legend i{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px;vertical-align:middle}
.dotmatrix{display:grid;grid-template-columns:repeat(12,1fr);gap:6px;padding:14px 16px;border-bottom:1px solid var(--rbc-border-subtle)}
.dotmatrix .cell{display:flex;flex-direction:column;align-items:center;gap:5px}
.dotmatrix .cell .d{width:12px;height:12px;border-radius:50%}
.dotmatrix .cell .l{font:400 10px/1 var(--rbc-font-mono);color:var(--rbc-text-tertiary)}
.dotmatrix .cell .lb{font:400 10px/1 var(--rbc-font-ui);color:var(--rbc-text-tertiary);white-space:nowrap}
.chrow{display:grid;grid-template-columns:14px 1.5fr 40px 66px 78px 1.1fr 96px;align-items:center;gap:10px;padding:8px 16px;border-bottom:1px solid var(--rbc-border-subtle);font-size:12px}
.chrow:last-child{border-bottom:0}
.chrow:hover{background:var(--rbc-bg-surface-hover)}
.chrow .cdot{width:8px;height:8px;border-radius:50%}
.chrow .cname{color:var(--rbc-text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.chrow .cstat.bad{color:var(--rbc-danger-fg)} .chrow .cstat.mut{color:var(--rbc-neutral-fg)}
/* 延迟迷你条 */
.latbar{height:6px;border-radius:var(--rbc-radius-pill);background:var(--rbc-bg-input);overflow:hidden}
.latbar i{display:block;height:100%;border-radius:inherit}
.attrib{display:flex;gap:20px;padding:12px 16px;background:var(--rbc-bg-app);border-top:1px solid var(--rbc-border-subtle);font-size:12px;flex-wrap:wrap}
.attrib b{font-family:var(--rbc-font-mono)}
.chan-note{font-size:11px;color:var(--rbc-text-tertiary);padding:0 16px 14px;line-height:1.6}
.chan-note code{font-family:var(--rbc-font-mono);color:var(--rbc-text-secondary)}

/* ── 日志时间线 ── */
.log{background:var(--rbc-bg-app);border:1px solid var(--rbc-border-subtle);border-radius:var(--rbc-radius-md);padding:12px 14px;font:400 12px/1.65 var(--rbc-font-mono);max-height:280px;overflow-y:auto}
.log .ln{display:flex;gap:10px;white-space:nowrap}
.log .ts{color:var(--rbc-text-tertiary)}
.log .src{font-weight:600}
.log .src.drv-i{color:var(--rbc-info-fg)} .log .src.drv-w{color:var(--rbc-warning-fg)}
.log .src.drv-e{color:var(--rbc-danger-fg)} .log .src.ui-i{color:var(--rbc-success-fg)}
.log .src.ui-w{color:var(--rbc-warning-fg)}
.log .msg{color:var(--rbc-text-secondary);white-space:pre-wrap}

/* ── 弹窗 ── */
.mask{position:absolute;inset:0;background:var(--rbc-scrim);display:flex;align-items:center;justify-content:center;padding:24px;z-index:300;animation:fadein var(--dur-fast) var(--ease-out)}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.modal{
  width:560px;max-width:100%;background:var(--rbc-bg-elevated);border:1px solid var(--rbc-border-strong);
  border-radius:var(--rbc-radius-lg);padding:20px;box-shadow:var(--rbc-shadow-floating);
  animation:rise var(--dur-base) var(--ease-out);
}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.modal h3{font:600 16px/1.4 var(--rbc-font-display);margin-bottom:14px;display:flex;align-items:center;gap:10px}
.modal .seg3{border-top:1px solid var(--rbc-border-subtle);padding-top:12px;margin-top:12px}
.modal .seg3 .lab{font:600 12px/1 var(--rbc-font-ui);color:var(--rbc-text-secondary);margin-bottom:5px;letter-spacing:.3px}
.modal .seg3 .txt{font-size:13px;color:var(--rbc-text-primary);line-height:1.6}
.modal .row{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
.modal .row .note{margin-right:auto;font-size:11px;color:var(--rbc-text-tertiary);align-self:center}

/* 向导全屏 */
.wizard{position:absolute;inset:0;background:var(--rbc-scrim);display:flex;align-items:center;justify-content:center;z-index:350;padding:32px}
.wizard .wp{width:720px;max-width:100%;background:var(--rbc-bg-elevated);border:1px solid var(--rbc-border-strong);border-radius:var(--rbc-radius-lg);box-shadow:var(--rbc-shadow-overlay);overflow:hidden;animation:rise var(--dur-base) var(--ease-out)}
.wizard .wh{padding:18px 22px;border-bottom:1px solid var(--rbc-border-subtle);display:flex;align-items:center;gap:14px}
.wizard .wh .wt{font:600 16px/1.3 var(--rbc-font-display)}
.steps{display:flex;gap:8px;margin-left:auto}
.steps .st{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--rbc-text-tertiary)}
.steps .st .n{width:18px;height:18px;border-radius:50%;border:1px solid var(--rbc-border-strong);display:flex;align-items:center;justify-content:center;font-size:11px}
.steps .st.on{color:var(--rbc-text-primary)} .steps .st.on .n{border-color:var(--rbc-accent);background:var(--rbc-accent);color:var(--rbc-text-on-accent);font-weight:600}
.steps .st.done .n{background:var(--rbc-success-solid);border-color:var(--rbc-success-solid);color:#fff}
.wizard .wb{padding:22px}
.wizard .wf{padding:14px 22px;border-top:1px solid var(--rbc-border-subtle);display:flex;gap:10px;justify-content:flex-end;align-items:center}
.wizard .wf .note{margin-right:auto;font-size:11px;color:var(--rbc-text-tertiary)}

/* 模式二选一 */
.pick{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pick .opt{border:1px solid var(--rbc-border-default);border-radius:var(--rbc-radius-md);padding:16px;cursor:pointer;background:var(--rbc-bg-input);transition:border-color var(--dur-fast) var(--ease-standard),background var(--dur-fast) var(--ease-standard)}
.pick .opt:hover{border-color:var(--rbc-border-strong)}
.pick .opt.on{border-color:var(--rbc-accent);background:var(--rbc-accent-subtle)}
.pick .opt .ot{font:600 14px/1.3 var(--rbc-font-ui);display:flex;align-items:center;gap:8px;margin-bottom:6px}
.pick .opt .od{font-size:12px;color:var(--rbc-text-secondary);line-height:1.6}
.pick .opt .tag{font:600 10px/1 var(--rbc-font-ui);padding:2px 7px;border-radius:var(--rbc-radius-xs);border:1px solid}
.pick .opt .tag.rec{color:var(--rbc-success-fg);border-color:var(--rbc-success-border);background:var(--rbc-success-bg)}
.pick .opt .tag.adv{color:var(--rbc-text-secondary);border-color:var(--rbc-border-default);background:var(--rbc-bg-app)}

/* 三步图 */
.step3{display:flex;gap:12px;align-items:flex-start;background:var(--rbc-bg-surface);border:1px solid var(--rbc-border-subtle);border-radius:var(--rbc-radius-md);padding:14px 16px;margin-bottom:10px}
.step3 .n{width:26px;height:26px;border-radius:50%;background:var(--rbc-accent);color:var(--rbc-text-on-accent);display:flex;align-items:center;justify-content:center;font:600 12px/1 var(--rbc-font-mono);flex:none}
.step3 .txt{font-size:13px;color:var(--rbc-text-primary);line-height:1.6}
.step3 .txt .mono{color:var(--rbc-accent);font-size:12px}
.step3 .txt .sub{font-size:11px;color:var(--rbc-text-tertiary);margin-top:4px}

/* 设置行 */
.setrow{display:flex;align-items:center;gap:14px;padding:14px 16px;border-bottom:1px solid var(--rbc-border-subtle);background:var(--rbc-bg-surface)}
.setrow:last-child{border-bottom:0}
.setrow .sk{flex:1}
.setrow .sk .t{font-size:13px;color:var(--rbc-text-primary)}
.setrow .sk .d{font-size:11px;color:var(--rbc-text-tertiary);margin-top:3px}
.setrow .sc{display:flex;align-items:center;gap:10px}

/* Toast */
.toast{position:absolute;right:20px;bottom:20px;background:var(--rbc-bg-elevated);border:1px solid var(--rbc-border-strong);border-radius:var(--rbc-radius-md);padding:12px 16px;font-size:13px;box-shadow:var(--rbc-shadow-floating);z-index:400;display:flex;align-items:center;gap:10px;max-width:360px;animation:toastIn var(--dur-base) var(--ease-out)}
.toast.out{animation:toastOut var(--dur-fast) var(--ease-in) forwards}
@keyframes toastIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes toastOut{from{opacity:1;transform:none}to{opacity:0;transform:translateY(8px)}}
.toast .dot{width:8px;height:8px;border-radius:50%;flex:none}

.flowchart{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--rbc-text-secondary);padding:12px 0}
.flowchart .fn{border:1px solid var(--rbc-border-default);border-radius:var(--rbc-radius-pill);padding:5px 12px;background:var(--rbc-bg-input)}
.flowchart .fn.red{border-color:var(--rbc-danger-border);color:var(--rbc-danger-fg)}
.flowchart .fn.amber{border-color:var(--rbc-warning-border);color:var(--rbc-warning-fg)}
.flowchart .fn.blue{border-color:var(--rbc-info-border);color:var(--rbc-info-fg)}
.flowchart .fn.green{border-color:var(--rbc-success-border);color:var(--rbc-success-fg)}
.flowchart .fa{color:var(--rbc-text-tertiary)}
.collapse{background:var(--rbc-bg-surface);border:1px solid var(--rbc-border-subtle);border-radius:var(--rbc-radius-md);overflow:hidden}
.collapse .ch{padding:12px 16px;cursor:pointer;display:flex;align-items:center;gap:8px;font:600 13px/1.4 var(--rbc-font-ui);color:var(--rbc-text-secondary)}
.collapse .ch:hover{color:var(--rbc-text-primary)}
.collapse .cb{padding:0 16px 14px}
.hide{display:none}

/* ── 图表容器 ── */
.chart{margin-top:10px}
.chart svg{display:block;width:100%}
.chart .legendrow{display:flex;gap:16px;font-size:11px;color:var(--rbc-text-secondary);margin-top:8px;flex-wrap:wrap}
.chart .legendrow i{width:10px;height:3px;border-radius:2px;display:inline-block;margin-right:6px;vertical-align:middle}
.chart .cap{font-size:11px;color:var(--rbc-text-tertiary);margin-top:8px}
/* 图表一次性描边入场（480ms · 仅首次） */
.draw{animation:draw var(--dur-slower) var(--ease-out) both}
@keyframes draw{from{stroke-dashoffset:var(--len)}to{stroke-dashoffset:0}}
/* 面积图淡入 */
.areaIn{animation:areaIn var(--dur-slower) var(--ease-out) both}
@keyframes areaIn{from{opacity:0}to{opacity:1}}

/* ═══════════ reduced-motion 全量降级（02b §B.5 · NH-5） ═══════════ */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:.01ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.01ms !important;
    scroll-behavior:auto !important;
  }
  .page-enter{animation:none !important;transform:none !important;opacity:1 !important}
  .dcard.hov:hover,.vcard.hov:hover{transform:none !important}
  .btn:active{transform:none !important}
  .badge.healing .dot,.statusbar .reconnect .dot,.sw.busy::after{animation:none !important;opacity:1 !important}
  .skel::after{animation:none !important;background:none !important}
  .prog.indet .fill{animation:none !important;transform:scaleX(.4) !important}
  .draw,.areaIn{animation:none !important;stroke-dashoffset:0 !important;opacity:1 !important}
}
</style>

/* ════════════════════════════════════════════════════════════
   工具
   ════════════════════════════════════════════════════════════ */
function reducedMotion(){ return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches); }
function nowStr(){ var d=new Date(); function p(n){return (n<10?'0':'')+n;} return p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds()); }
/* 确定性伪随机序列（保证每次渲染一致） */
function mkSeries(n,start,end,noise,seed){
  var out=[], s=seed||7;
  function rnd(){ s=(s*9301+49297)%233280; return s/233280; }
  for(var i=0;i<n;i++){ var t=i/(n-1); out.push(start+(end-start)*t+(rnd()-0.5)*noise); }
  return out;
}
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }

/* ════════════════════════════════════════════════════════════

   ════════════════════════════════════════════════════════════ */
var S = {
  installed:true,          // 控制设备是否可打开
  connErr:null,            // null | 'access'(5) | 'notfound'(2/3)
  protocolOk:true,         // GET_VERSION 协议号是否匹配（硬校验）
  drvProto:9, uiProto:9,   // MF-1：协议不匹配一律「驱动 8 / 控制台 9」
  loading:false,           // NH-1：加载态
  volumes:[                // GET_VOLUMES 结果
    {letter:'D:',label:'数据盘',cap:'1.0 TB',sys:false,bound:true},
    {letter:'F:',label:'游戏盘',cap:'2.0 TB',sys:false,bound:true},

/* ── 六态唯一判定函数（对齐 design-system §C.1 / 需求 RB.1）── */
function userState(){
  if(!S.installed) return 'notinstalled';
  if(!S.protocolOk) return 'protocol';
  if(S.panic) return S.settling ? 'panic-heal' : 'panic';
  if(S.safeMode) return 'safemode';
  var anyBound = S.volumes.some(function(v){return v.bound;});
  if(!anyBound) return 'bound';
  var anyAttached = S.volumes.some(function(v){return S.attached[v.letter];});
  if(!anyAttached) return 'ready';
  var attachedVols = S.volumes.filter(function(v){return S.attached[v.letter];});
  if(attachedVols.some(function(v){return S.mode[v.letter]===1;})) return 'accel-back';
  return 'accel-through';
}

/* ════════════ 状态条（四段）════════════ */
function segs(){
  var out=[];
  // 驱动段
  if(S.loading){
    out.push({nm:'驱动', val:'正在读取…', c:'mut', go:'diag'});
  }else if(!S.installed){
    var code = S.connErr==='access' ? '5' : (S.connErr==='notfound'?'2':'—');
    out.push({nm:'驱动', val:'未连接（错误 '+code+'）', c:'bad', go:'diag', why:'控制设备打开失败'});
  }else if(!S.protocolOk){
    out.push({nm:'驱动', val:'版本不匹配', c:'bad', go:'diag', why:'协议号 ≠ 控制台期望'});
  }else if(S.retrying){
    out.push({nm:'驱动', val:'正在重连…', c:'warn', go:'diag', why:'轮询退避重连中'});
  }else{
    out.push({nm:'驱动', val:'已连接 v10.3.4.19', c:'ok', go:'diag'});
  }
  // 挂栈段
  var boundN = S.volumes.filter(function(v){return v.bound;}).length;
  out.push(boundN>0 ? {nm:'挂栈', val:'已挂 '+boundN+' 卷', c:'ok', go:'boost'}
                    : {nm:'挂栈', val:'未挂栈', c:'bad', go:'boost', why:'尚无卷挂到驱动'});
  // 加速段
  var st = userState();
  var accC = (st==='accel-through'||st==='accel-back') ? 'ok'
           : (st==='safemode'?'warn':(st==='panic'||st==='panic-heal'||st==='protocol'?'bad':'mut'));
  var accV = (st==='accel-through')?'正常加速中'
           : (st==='accel-back')?'正常加速中（含回写卷）'
           : (st==='safemode')?'安全模式'
           : (st==='panic'||st==='panic-heal')?'熔断中'
           : (st==='protocol')?'已禁用'
           : (st==='notinstalled')?'未安装' : '就绪未加速';
  out.push({nm:'加速', val:accV, c:accC, go:'state'});
  // 风险段
  var r;
  if(st==='panic'||st==='panic-heal') r={nm:'风险',val:'熔断中',c:'bad',go:'rescue'};
  else if(S.lost>0) r={nm:'风险',val:'已确认丢失 '+S.lost+' MB',c:'warn',go:'rescue'};
  else if(S.safeMode) r={nm:'风险',val:'安全模式（上次异常退出）',c:'warn',go:'rescue'};
  else if(S.dirty>0 && S.dirty>200) r={nm:'风险',val:'未落盘 '+S.dirty+' MB',c:'warn',go:'rescue'};
  else r={nm:'风险',val:'无',c:'ok',go:'rescue'};
  out.push(r);
  return out;
}

  var h = segs().map(function(s){
    var click = (s.c!=='ok');
    return '<button class="seg '+s.c+(click?' click':'')+'" '+(click?'onclick="go(\''+s.go+'\')" title="'+(s.why||('跳转到 '+s.nm+' 处置'))+'"':'disabled style="cursor:default"')+'>'+

}

/* 迷你图 Sparkline（02b §A.3）：28px 高、1.5px 线、末端 3px 圆点、无轴无填充 */
function sparkSVG(data, color){
  var W=120,H=28,pad=3, n=data.length;
  var min=Math.min.apply(null,data), max=Math.max.apply(null,data), rng=(max-min)||1;
  function X(i){return pad+(W-2*pad)*i/(n-1);}
  function Y(v){return H-pad-(H-2*pad)*((v-min)/rng);}
  var d=data.map(function(v,i){return (i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1);}).join(' ');
  var lx=X(n-1), ly=Y(data[n-1]);
  return '<svg class="spark" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none"><path d="'+d+'" fill="none" stroke="'+color+'" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="'+lx.toFixed(1)+'" cy="'+ly.toFixed(1)+'" r="3" fill="'+color+'"/></svg>';
}

/* #1 读命中率趋势（折线 + 单色低透明度面积 · 60 采样点 · 支持断线 gap） */
function trendChart(series, opt){
  opt=opt||{};
  var W=520,H=170,padL=30,padR=14,padT=12,padB=24;
  var n=series.length;
  function X(i){return padL+(W-padL-padR)*i/(n-1);}
  function Y(v){return H-padB-(H-padT-padB)*(v/100);}
  var g='';
  [0,50,100].forEach(function(v){
    g+='<line x1="'+padL+'" y1="'+Y(v).toFixed(1)+'" x2="'+(W-padR)+'" y2="'+Y(v).toFixed(1)+'" stroke="var(--chart-grid)" stroke-width="1"/>'+
       '<text x="2" y="'+(Y(v)+4).toFixed(1)+'" fill="var(--chart-axis-text)" font-size="10" font-family="var(--rbc-font-mono)">'+v+'%</text>';
  });
  // 分段（支持 null 断点）
  var segsArr=[], curSeg=[];
  series.forEach(function(v,i){ if(v===null){ if(curSeg.length){segsArr.push(curSeg);curSeg=[];} } else curSeg.push([i,v]); });
  if(curSeg.length) segsArr.push(curSeg);
  var lineD='', areaD='';
  segsArr.forEach(function(seg){
    lineD += seg.map(function(p,i){return (i?'L':'M')+X(p[0]).toFixed(1)+' '+Y(p[1]).toFixed(1);}).join(' ')+' ';
  });
  if(segsArr.length){
    var first=segsArr[0], last=segsArr[segsArr.length-1];
    areaD = lineD+' L '+X(last[last.length-1][0]).toFixed(1)+' '+(H-padB)+' L '+X(first[0][0]).toFixed(1)+' '+(H-padB)+' Z';
  }
  var lastV = series[n-1];
  var endLabel = (lastV!=null) ? '<text x="'+(W-padR)+'" y="'+(Y(lastV)-8).toFixed(1)+'" fill="var(--chart-1)" font-size="11" font-family="var(--rbc-font-mono)" text-anchor="end">'+lastV.toFixed(1)+'%</text>' : '';
  var axis='<text x="'+padL+'" y="'+(H-6)+'" fill="var(--chart-axis-text)" font-size="10" font-family="var(--rbc-font-ui)">5 分钟前</text>'+
           '<text x="'+(W-padR)+'" y="'+(H-6)+'" fill="var(--chart-axis-text)" font-size="10" font-family="var(--rbc-font-ui)" text-anchor="end">现在</text>';
  var areaCls = opt.animate ? 'areaIn' : '';
  var lineCls = opt.animate ? 'draw' : '';
  var lenAttr = opt.animate ? ' style="--len:1400"' : '';
  return '<div class="chart"><svg viewBox="0 0 '+W+' '+H+'">'+g+
    '<path class="'+areaCls+'" d="'+areaD+'" fill="var(--chart-area-fill)" stroke="none"/>'+
    '<path class="'+lineCls+'" d="'+lineD+'" fill="none" stroke="var(--chart-1)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="1400" stroke-dashoffset="'+(opt.animate?'1400':'0')+'"'+lenAttr+'/>'+
    endLabel+axis+'</svg></div>';
}

/* #2 缓存占用环形（中心大数字） */
function ringChart(used, cap, opt){
  var R=54,C=2*Math.PI*R, pct=clamp(used/cap,0,1), off=C*(1-pct);
  var over = used>cap;
  var col = over ? 'var(--chart-warn)' : 'var(--chart-1)';
  return '<div class="chart"><svg viewBox="0 0 160 160" style="width:160px;height:160px;margin:6px auto 0">'+
    '<circle cx="80" cy="80" r="'+R+'" fill="none" stroke="var(--chart-track)" stroke-width="10"/>'+
    '<circle class="'+((opt&&opt.animate)?'areaIn':'')+'" cx="80" cy="80" r="'+R+'" fill="none" stroke="'+col+'" stroke-width="10" stroke-linecap="round" stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'" transform="rotate(-90 80 80)"/>'+
    '<text x="80" y="76" text-anchor="middle" fill="var(--rbc-text-primary)" font-size="22" font-weight="600" font-family="var(--rbc-font-mono)">'+used.toFixed(1)+'</text>'+
    '<text x="80" y="92" text-anchor="middle" fill="var(--rbc-text-tertiary)" font-size="11" font-family="var(--rbc-font-mono)">GB / '+cap.toFixed(1)+' GB</text>'+
    (over?'<text x="80" y="112" text-anchor="middle" fill="var(--chart-warn)" font-size="11" font-family="var(--rbc-font-ui)">已超限</text>':'')+
    '</svg></div>';
}

/* #3 读写吞吐（双序列对比 · 数据系两色） */
function throughputChart(readS, writeS, opt){
  var W=520,H=150,padL=40,padR=14,padT=12,padB=24, n=readS.length;
  var max=Math.max(Math.max.apply(null,readS),Math.max.apply(null,writeS))*1.15;
  function X(i){return padL+(W-padL-padR)*i/(n-1);}
  function Y(v){return H-padB-(H-padT-padB)*(v/max);}
  function path(a){ return a.map(function(v,i){return (i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1);}).join(' '); }
  var g='';
  [0,0.5,1].forEach(function(f){
    var v=max*f;
    g+='<line x1="'+padL+'" y1="'+Y(v).toFixed(1)+'" x2="'+(W-padR)+'" y2="'+Y(v).toFixed(1)+'" stroke="var(--chart-grid)" stroke-width="1"/>'+
       '<text x="2" y="'+(Y(v)+4).toFixed(1)+'" fill="var(--chart-axis-text)" font-size="10" font-family="var(--rbc-font-mono)">'+Math.round(v)+'</text>';
  });
  var cls=opt&&opt.animate?'draw':'';
  var off=opt&&opt.animate?'1400':'0';
  return '<div class="chart"><svg viewBox="0 0 '+W+' '+H+'">'+g+
    '<path class="'+cls+'" d="'+path(readS)+'" fill="none" stroke="var(--chart-1)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="1400" stroke-dashoffset="'+off+'"/>'+
    '<path class="'+cls+'" d="'+path(writeS)+'" fill="none" stroke="var(--chart-2)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="1400" stroke-dashoffset="'+off+'"/>'+
    '<text x="'+(W-padR)+'" y="'+(H-6)+'" fill="var(--chart-axis-text)" font-size="10" font-family="var(--rbc-font-ui)" text-anchor="end">现在</text>'+
    '</svg>'+
    '<div class="legendrow"><span><i style="background:var(--chart-1)"></i>读吞吐 MB/s</span><span><i style="background:var(--chart-2)"></i>写吞吐 MB/s</span><span style="color:var(--rbc-text-tertiary)">纵轴单位 MB/s</span></div></div>';
}

/* #4 64 分片吞吐（迷你热力条 · 3 档色阶） */
function shardHeat(shards, opt){
  var W=384,H=24, cw=4, gap=2, max=Math.max.apply(null,shards);
  var cells='';
  shards.forEach(function(v,i){
    var r=v/max, col = r>0.66?'var(--chart-heat-3)':(r>0.33?'var(--chart-heat-2)':'var(--chart-heat-1)');
    cells+='<rect x="'+(i*(cw+gap))+'" y="0" width="'+cw+'" height="'+H+'" rx="1" fill="'+col+'"/>';
  });
  return '<div class="chart"><svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" style="height:24px">'+cells+'</svg>'+
    '<div class="legendrow"><span><i style="background:var(--chart-heat-1)"></i>低</span><span><i style="background:var(--chart-heat-2)"></i>中</span><span><i style="background:var(--chart-heat-3)"></i>高</span><span style="color:var(--rbc-text-tertiary)">64 分片归一化到当期最大值</span></div></div>';
}

/* #5 未落盘数据（堆叠水平条：未落盘 / 已确认丢失） */
function dirtyStack(dirty, lost, capMB){
  var total=dirty+lost;
  if(total<=0) return '<div class="chart"><div class="latbar" style="height:10px"><i style="width:100%;background:var(--chart-track)"></i></div><div class="cap">无未落盘数据（显示「—」，不画 0 长度条）</div></div>';
  var dw=clamp(dirty/capMB*100,0,100), lw=clamp(lost/capMB*100,0,100-dw);
  return '<div class="chart"><div style="display:flex;height:10px;border-radius:999px;overflow:hidden;background:var(--chart-track)">'+
    (dirty>0?'<i style="width:'+dw.toFixed(1)+'%;background:var(--chart-warn);display:block"></i>':'')+
    (lost>0?'<i style="width:'+lw.toFixed(1)+'%;background:var(--chart-danger);display:block"></i>':'')+
    '</div>'+
    '<div class="legendrow"><span><i style="background:var(--chart-warn)"></i>未落盘 '+dirty+' MB</span>'+
    (lost>0?'<span><i style="background:var(--chart-danger)"></i>已确认丢失 '+lost+' MB</span>':'')+
    '<span style="color:var(--rbc-text-tertiary)">相对缓存上限 '+ (capMB/1024).toFixed(1) +' GB</span></div></div>';
}

/* #7 写模式构成（分段水平条：直写 / 回写 卷数） */
function writeModeBar(){
  var bound=S.volumes.filter(function(v){return v.bound && S.attached[v.letter];});
  if(!bound.length) return '<div class="chart"><div class="latbar" style="height:10px"><i style="width:100%;background:var(--chart-track)"></i></div><div class="cap">尚未加速任何卷</div></div>';
  var through=bound.filter(function(v){return S.mode[v.letter]!==1;}).length;
  var back=bound.filter(function(v){return S.mode[v.letter]===1;}).length;
  var total=bound.length, tw=through/total*100, bw=back/total*100;
  return '<div class="chart"><div style="display:flex;height:10px;border-radius:999px;overflow:hidden;background:var(--chart-track)">'+
    (through>0?'<i style="width:'+tw.toFixed(1)+'%;background:var(--chart-ok);display:block"></i>':'')+
    (back>0?'<i style="width:'+bw.toFixed(1)+'%;background:var(--chart-warn);display:block"></i>':'')+
    '</div>'+
    '<div class="legendrow"><span><i style="background:var(--chart-ok)"></i>直写 '+through+' 卷</span>'+
    (back>0?'<span><i style="background:var(--chart-warn)"></i>回写 '+back+' 卷</span>':'<span style="color:var(--rbc-text-tertiary)">无回写卷</span>')+
    '</div></div>';
}

/* 数据卡（大数字 + 迷你趋势图）：数字单独包裹，避免滚动时擦除单位 */
function dcard(k, val, unit, sub, spark, sparkColor){
  var dec = String(val).indexOf('.')>=0 ? 1 : 0;
  return '<div class="dcard hov"><div class="k">'+k+'</div>'+
    '<div class="vrow"><div class="v num"><span data-roll="'+val+'" data-dec="'+dec+'">'+val+'</span>'+(unit?'<span class="u">'+unit+'</span>':'')+'</div></div>'+
    (spark?sparkSVG(spark, sparkColor||'var(--chart-1)'):'')+
    '<div class="s">'+sub+'</div></div>';
}
function dcardUnavail(k){
  return '<div class="dcard unavail"><div class="flag">'+badge('数据暂停','amber')+'</div><div class="k">'+k+'</div><div class="vrow"><div class="v">—</div></div><div class="s">统计暂不可用</div></div>';
}

/* ════════════════════════════════════════════════════════════
   页面：状态（首页）
   ════════════════════════════════════════════════════════════ */
function pgState(){
  var st=userState(), h='';

      '<button class="btn danger" onclick="askPanic()" '+(S.panic?'disabled title="已处于熔断状态"':'')+'>一键熔断</button>');

  if(S.loading){
    h+='<div class="alert info"><div class="at">正在读取驱动状态…</div><div class="ar">首次连接或切换状态时读取驱动快照，请稍候。</div>'+
       '<div class="prog indet"><div class="fill"></div></div></div>';
    h+=skeletonCards();
    return h;
  }

    h+=alertCard('danger','驱动版本与控制台不匹配（驱动 8 / 控制台 9）',

      '<button class="btn pri" onclick="toast(\'已打开重新安装指引\',\'info\')">打开重新安装指引</button><button class="btn" onclick="go(\'diag\')">打开诊断</button>',
      '<span>错误码 Win32 87</span><span>消息 #10 GET_VERSION</span><span>'+nowStr()+'</span>');
  }
  // 熔断
  if(S.panic){
    var healing=S.settling;
    h+=alertCard('danger','缓存已熔断（全局透传）',
      '所有读写直接到盘，缓存暂停，数据最安全但速度最慢。'+(healing?'驱动正在把未落盘数据写完（自愈中），此时解除会被驱动拒绝。':'未落盘数据已写完，可以解除熔断。'),
      '<button class="btn" onclick="go(\'rescue\')">前往应急处理</button>'+
      (healing?'<button class="btn" disabled title="自愈未完成，暂不可解除">解除熔断（自愈中）</button>':'<button class="btn pri" onclick="clearPanic()">解除熔断</button>'),
      '<span>'+(healing?'错误码 0xC00000A3（自愈未完成）':'自愈已完成，无活跃错误')+'</span><span>'+(healing?'消息 #11 PANIC / #12 PANIC_CLEAR':'消息 #12 PANIC_CLEAR 已确认')+'</span>',
      healing?'<div class="prog indet"><div class="fill"></div></div><div style="font-size:11px;color:var(--rbc-text-secondary)">正在把未落盘数据写完…（'+S.dirty+' MB 待回写）</div>':'');
  }
  // 安全模式
  if(S.safeMode){
    h+=alertCard('warn','降级 · 安全模式',
      '上次未正常退出，已强制直写保护数据。请确认数据无误后退出安全模式。',
      '<button class="btn" onclick="go(\'rescue\')">前往应急处理</button><button class="btn ghost" onclick="exitSafe()">确认数据无误，退出安全模式</button>',
      '<span>安全模式 = 开</span><span>消息 #1 GET_STATS</span>');
  }
  // 未安装 / 权限不足（MF-3：access 可触发，Win32 5 与 2/3 文案不同）
  if(!S.installed){
    var access = S.connErr==='access';
    h+=alertCard('danger', access?'没有权限访问缓存驱动。':'未检测到缓存驱动。',
      access?'原因：控制设备仅允许管理员访问。下一步：右键以管理员身份运行本程序。'
            :'原因：驱动未安装或未启动。下一步：点击「运行安装向导」。',
      access?'<button class="btn pri" onclick="toast(\'请关闭本窗口，右键以管理员身份重新运行\',\'info\')">以管理员身份重开</button><button class="btn" onclick="go(\'diag\')">打开诊断</button>'
            :'<button class="btn pri" onclick="openWizard()">运行安装向导</button><button class="btn" onclick="go(\'diag\')">打开诊断</button>',
      '<span>错误码 Win32 '+(access?'5':'2')+'</span><span>消息 #10 GET_VERSION</span><span>'+nowStr()+'</span>');
  }
  // FLUSH 失败（MF-2：三段式）
  if(S.flushFail){
    h+=alertCard('warn','数据尚未完全写入磁盘。',
      '原因：磁盘报告写入错误（STATUS_IO_DEVICE_ERROR 0xC0000001）。下一步：检查磁盘健康；<b>未落盘数据仍在缓存中</b>，可稍后重试。',
      '<button class="btn pri" onclick="retryFlush()">稍后重试</button><button class="btn" onclick="go(\'rescue\')">前往应急处理</button>',
      '<span>错误码 0xC0000001（专属 FLUSH 失败）</span><span>消息 #3 FLUSH</span><span>'+nowStr()+'</span>');
  }

  // 三数字摘要（大数字 + 迷你趋势图 · 数据与图表同源）
  if(S.statsOk){
    h+='<div class="grid3">'+
      dcard('读命中率', S.hit.toFixed(1), '%', '近 5 分钟 · 1 秒轮询', S.hitSeries, 'var(--chart-1)')+
      dcard('省下磁盘读', S.savedGB.toFixed(1), 'GB', '累计 · 随使用增长', S.savedSeries, 'var(--chart-ok)')+
      dcard('缓存占用', S.cacheUsed.toFixed(1), 'GB', '上限 '+S.cacheCap.toFixed(1)+' GB · 未落盘 '+S.dirty+' MB', S.cacheSeries, 'var(--chart-1)')+
      '</div>';
  }else{
    h+='<div class="grid3">'+dcardUnavail('读命中率')+dcardUnavail('省下磁盘读')+dcardUnavail('缓存占用')+'</div>'+
      '<div style="font-size:11px;color:var(--rbc-text-secondary);margin-top:8px">统计暂不可用（'+(S.installed?(S.retrying?'驱动连接退避重连中':'驱动连接正常但采样超时'):'驱动未连接')+'）——数值以「—」呈现，<b>不以 0 呈现</b>，避免误读为「未生效」。'+
      ' <button class="btn ghost sm" onclick="retryStats()">重试</button></div>';
  }

  // 卷状态卡
  h+='<h2 class="sec">卷状态<span class="hint-inline">共 '+S.volumes.length+' 卷 · 每卷含六态徽标 / 写模式 / 主行动 / 停止加速</span></h2>';

  if(!S.installed){
    h+=emptyState('尚未安装缓存驱动','安装后可对固定盘（数据盘 / 游戏盘）开启加速','<button class="btn pri" onclick="openWizard()">运行安装向导</button>');
  }else if(boundVols.length===0){
    h+=emptyState('尚未挂载任何卷','标准模式需一次重启完成挂栈；也可用保守模式运行时挂载','<button class="btn pri" onclick="openWizard()">运行首次向导</button>');
  }else{
    boundVols.forEach(function(v){ h+=volCard(v); });
    if(!anyAttached){
      h+='<div style="margin-top:6px">'+emptyState('尚未加速任何卷','已挂栈卷处于「就绪未加速」，可一键开启','<button class="btn pri" onclick="go(\'boost\')">去开启加速</button>')+'</div>';
    }
  }
  return h;
}
function volCard(v){
  var vs=volState(v), acc=S.attached[v.letter];
  var acts='';
  if(S.attaching && !acc){
    acts='<button class="btn" disabled title="正在退避重试挂载（300/600/900ms）">正在挂载…</button>'+
         '<span class="prog indet" style="width:90px;display:inline-block;vertical-align:middle;margin:0"><span class="fill" style="display:block"></span></span>';
  }else if(S.panic){
    acts='<button class="btn" disabled title="熔断中，写操作已禁用">开启/停止加速</button>';
  }else if(!acc){
    acts='<button class="btn pri" onclick="toggleAccel(\''+v.letter+'\')" '+(S.protocolOk?'':'disabled title="协议不匹配，已禁用写操作"')+'>开启加速</button>';
  }else{
    acts=writeSel(v.letter,!S.protocolOk)+
      '<button class="btn" onclick="flushVol(\''+v.letter+'\')">立即回写</button>'+
      '<button class="btn" onclick="toggleAccel(\''+v.letter+'\')">停止加速</button>';
  }
  var why='';
  if(v.sys && !acc) why='<div class="why">缓存系统盘 C: 会增加开机异常风险；如确需，请先了解应急页的回滚指引。</div>';
  return '<div class="vcard hov'+(acc?'':' dim')+'">'+
    '<span class="vid num">'+v.letter+'</span>'+
    '<span class="vinfo"><span class="lbl">'+v.label+'</span><br><span class="cap">'+v.cap+'</span></span>'+
    '<span class="vstate">'+badge(vs.t,vs.c,vs.corner?'corner':'')+'</span>'+
    '<span class="vmode">写模式：'+(acc?modeShort(S.mode[v.letter]):'—')+'</span>'+
    '<span class="acts">'+acts+'</span>'+why+'</div>';
}

  // 卷列表
  h+='<h2 class="sec">卷列表</h2>';
  S.volumes.forEach(function(v){
    var vs=volState(v), acc=S.attached[v.letter];
    var verify = (S.verify && S.verify.letter===v.letter) ? S.verify : null;
    var ctrl;
    if(!v.bound){
      ctrl='<span class="vmode">'+badge('未挂栈','gray')+'</span><button class="btn" disabled title="该卷未挂到缓存驱动，请先完成挂栈（标准模式需重启）">开启加速</button>';
    }else if(S.attaching && !acc){
      ctrl=badge('挂载中 · 重试','amber','healing')+'<span class="prog indet" style="width:80px;display:inline-block;vertical-align:middle;margin:0"><span class="fill" style="display:block"></span></span>';
    }else if(S.panic){
      ctrl=badge('熔断 · 透传','red')+'<button class="btn" disabled title="熔断中，写操作已禁用">开启/停止加速</button>';
    }else if(!acc){
      ctrl=writeSel(v.letter,!S.protocolOk)+
        '<button class="sw" role="switch" aria-checked="false" onclick="toggleAccel(\''+v.letter+'\')" '+(S.protocolOk?'':'disabled')+' title="开启加速"></button>';
    }else{
      ctrl=badge(vs.t,vs.c,vs.corner?'corner':'')+
        writeSel(v.letter,!S.protocolOk)+
        '<button class="sw on" role="switch" aria-checked="true" onclick="toggleAccel(\''+v.letter+'\')" title="停止加速"></button>';
    }
    var vmsg='';
    if(verify && verify.phase==='running') vmsg='<div class="why">正在验证加速效果…（挂载即验证，3 秒内给出结论）</div>';
    else if(verify && verify.phase==='done') vmsg='<div class="why ok">已加速 · 命中率 '+Math.round(verify.hit)+'%（挂载后 2.4 秒验证通过）</div>';
    else if(v.sys) vmsg='<div class="why">系统盘 C:：缓存会增加开机异常风险，开启需二次确认；如开机异常可用应急页回滚。</div>';
    h+='<div class="vcard hov">'+
      '<span class="vid num">'+v.letter+'</span>'+
      '<span class="vinfo"><span class="lbl">'+v.label+'</span><br><span class="cap">'+v.cap+'</span></span>'+
      '<span class="acts" style="margin-left:0">'+ctrl+'</span>'+vmsg+'</div>';
  });

  // 批量操作
  h+='<h2 class="sec">批量操作</h2><div class="vcard"><span class="vinfo"><span class="lbl">对所有非系统盘一键开启加速（直写）</span><br><span class="cap">跳过 C: 等系统卷</span></span>'+
     '<span class="acts"><button class="btn" onclick="batchAccel()" '+(S.protocolOk&&!S.panic&&!S.attaching?'':'disabled title="协议不匹配或熔断中，已禁用"')+'>批量开启加速</button>'+
     '<button class="btn" onclick="flushAll()">全部立即回写</button></span></div>';
  return h;
}

function checkRow(name,res,ev,c){
  return '<tr><td style="padding-left:16px">'+name+'</td><td>'+badge(res,c)+'</td><td class="ev">'+ev+'</td></tr>';
}
function channelPanel(){
  var cnt={ok:0,warn:0,bad:0,mut:0};
  S.ch.forEach(function(m){cnt[m.st]++;});
  // 12 格点阵（图表 #6 点阵部分）
  var matrix=S.ch.map(function(m){
    var c={ok:'var(--chart-ok)',warn:'var(--chart-warn)',bad:'var(--chart-danger)',mut:'var(--chart-neutral)'}[m.st];
    return '<div class="cell"><span class="d" style="background:'+c+'"></span><span class="l">#'+m.n+'</span><span class="lb">'+m.name+'</span></div>';
  }).join('');
  // 延迟迷你条：归一化（正常按延迟，其余 0 宽不渲染）
  var maxLat=0; S.ch.forEach(function(m){ if(m.st==='ok'){ var v=parseFloat(m.lat); if(v>maxLat)maxLat=v; } });
  var rows=S.ch.map(function(m){
    var stTxt={ok:'正常',warn:'降级 · 重试中',bad:'不可用',mut:'未接通'}[m.st];
    var c={ok:'var(--chart-ok)',warn:'var(--chart-warn)',bad:'var(--chart-danger)',mut:'var(--chart-neutral)'}[m.st];
    var latBar='';
    if(m.st==='ok'){ var v=parseFloat(m.lat); var w=maxLat?clamp(v/maxLat*100,8,100):100; latBar='<div class="latbar"><i style="width:'+w.toFixed(0)+'%;background:var(--chart-1)"></i></div>'; }
    else if(m.st==='warn'){ latBar='<div class="latbar"><i style="width:35%;background:var(--chart-warn)"></i></div>'; }
    else { latBar='<div class="latbar"></div>'; }
    return '<div class="chrow">'+
      '<span class="cdot" style="background:'+c+'"></span>'+
      '<span class="cname">'+m.name+'</span>'+
      '<span class="cno">#'+m.n+'</span>'+
      '<span class="clat">'+m.lat+'</span>'+
      '<span class="ctime">'+m.t+'</span>'+
      latBar+
      '<span class="cstat '+m.st+'">'+stTxt+(m.err?' ('+m.err+')':'')+'</span>'+
      '</div>';
  }).join('');
  // MF-3：瞬时错误码可视（21/170/0x80000011）
  var hasTransient = S.ch.some(function(m){return m.st==='warn';});
  return '<div class="panel">'+
    '<div class="ph"><span class="pt">IOCTL 0x222000 · Protocol 9</span><span class="ps">单通道承载 12 条消息</span>'+
    '<span class="legend"><span><i style="background:var(--rbc-success-fg)"></i>正常 '+cnt.ok+'</span><span><i style="background:var(--rbc-warning-fg)"></i>降级 '+cnt.warn+'</span><span><i style="background:var(--rbc-danger-fg)"></i>不可用 '+cnt.bad+'</span><span><i style="background:var(--rbc-neutral-fg)"></i>未接通 '+cnt.mut+'</span></span></div>'+
    '<div class="dotmatrix">'+matrix+'</div>'+
    rows+
    '<div class="attrib">'+
      '<span>归因：<b>'+attrib()+'</b></span>'+
      '<span>驱动侧：'+(S.installed?'响应正常':'无响应')+'</span>'+
      '<span>UI 侧：轮询任务运行中（1s，退避上限 10s）</span>'+
      '<span>最近错误：'+lastErr()+'</span>'+
    '</div>'+
    (hasTransient?'<div class="chan-note">瞬时错误码（可自动退避重试，最多 3 次，300/600/900ms）：<code>Win32 170（驱动忙）</code> · <code>Win32 21（设备未就绪）</code> · <code>0x80000011（设备忙）</code>。确定性拒绝（<code>Win32 5</code> / 负 NTSTATUS）立即失败不重试。</div>':'')+
    '</div>';
}
function attrib(){
  if(!S.installed) return '驱动问题（控制设备打不开）';
  if(!S.protocolOk) return '驱动问题（协议不匹配）';
  if(S.ch.some(function(m){return m.st==='bad';})) return '驱动问题（消息返回确定性错误）';
  if(S.ch.some(function(m){return m.st==='warn';})) return '瞬时问题（正在退避重试）';
  return '无异常';
}
function lastErr(){
  if(!S.installed) return 'Win32 '+(S.connErr==='access'?'5':'2')+' @ 消息 #10';
  if(!S.protocolOk) return 'Win32 87 @ 消息 #10';
  if(S.flushFail) return '0xC0000001 @ 消息 #3';
  if(S.panic&&S.settling) return '0xC00000A3 @ 消息 #12';
  if(S.attaching) return 'Win32 170 @ 消息 #8';
  return '无';
}

function pgRescue(){
  var h=pageHead('应急','危险与故障的唯一去处 · 熔断 / 安全模式 / 回滚指引 ≤ 2 次点击可达','');

  // 熔断
  h+='<h2 class="sec">一键熔断<span class="hint-inline">所有读写直接到盘，缓存暂停（数据最安全，速度最慢）</span></h2>';
  var btn, note='';
  if(!S.panic){
    btn='<button class="btn danger" onclick="askPanic()">一键熔断</button>';
    note='<div class="d">将发生什么 / 影响与风险 / 如何撤销 —— 点击后以三段式确认弹窗呈现，危险按钮不做默认焦点。</div>';
  }else if(S.settling){
    btn='<button class="btn" disabled title="自愈未完成，暂不可解除">解除熔断（自愈中，暂不可用）</button>';
    note='<div class="d" style="color:var(--rbc-warning-fg)">原因：驱动正在把未落盘数据写完（自愈中）。下一步：等待风险段变为「无」后重试。</div>'+
         '<div class="prog indet"><div class="fill"></div></div><div style="font-size:11px;color:var(--rbc-text-secondary)">正在把未落盘数据写完…（'+S.dirty+' MB 待回写）</div>';
  }else{
    btn='<button class="btn pri" onclick="clearPanic()">解除熔断</button>';
    note='<div class="d" style="color:var(--rbc-success-fg)">自愈已完成，可以解除熔断，恢复到「就绪未加速」。</div>';
  }
  h+='<div class="panel"><div class="setrow"><div class="sk"><div class="t">缓存熔断开关</div>'+note+'</div>'+btn+'</div></div>';

  // MF-2：FLUSH 失败三段式卡（应急页）
  if(S.flushFail){

/* 数字滚动计数（320ms · rAF · 仅 transform/opacity 无关；reduced-motion 直显） */
var lastVals={};
function rollNumbers(){
  var els=document.querySelectorAll('[data-roll]');
  els.forEach(function(el){
    var target=parseFloat(el.getAttribute('data-roll'));
    var dec=parseInt(el.getAttribute('data-dec')||'0',10);
    var key='k'+(el.getAttribute('data-roll'))+'_'+(el.parentNode?el.parentNode.childNodes.length:'')+'_'+(el.getAttribute('data-dec'));
    var from=lastVals[key];
    if(from===undefined) from=0;
    lastVals[key]=target;
    if(reducedMotion()||from===target){ el.textContent=fmt(target,dec); return; }
    animateNumber(el,from,target,dec);
  });
}
function fmt(v,dec){ return dec>0? v.toFixed(dec) : Math.round(v).toString(); }
function animateNumber(el,from,to,dec){
  var start=performance.now(), dur=320;
  function step(t){
    var p=Math.min(1,(t-start)/dur);
    var e=1-Math.pow(1-p,3);
    el.textContent=fmt(from+(to-from)*e,dec);
    if(p<1) requestAnimationFrame(step); else el.textContent=fmt(to,dec);
  }
  requestAnimationFrame(step);
}

/* ════════════ 交互动作 ════════════ */
function toggleAccel(letter){
  if(!S.protocolOk || S.panic) return;
  var v=S.volumes.filter(function(x){return x.letter===letter;})[0];
  if(!v || !v.bound) return;
  if(S.attached[letter]){
    S.attached[letter]=false; S.verify=null;
    toast('已停止 '+letter+' 加速','info');
    render();
  }else{
    // MF-4：若处于挂载重试演示态，走退避路径；否则直接成功 + 挂载即验证
    if(S.attaching){
      toast('挂载中：正在退避重试（300/600/900ms）','warn');
      setTimeout(function(){
        S.attaching=false; S.attached[letter]=true;
        setCh(8,'ok','1.9 ms','刚刚'); S.verify={letter:letter,phase:'done',hit:S.hit};
        toast(letter+' 已加速 · 命中率 '+Math.round(S.hit)+'%','ok'); render();
      },1400);
      render();
      return;
    }
    S.attached[letter]=true;
    setCh(8,'ok','1.9 ms','刚刚');
    S.verify={letter:letter,phase:'running'};
    render();
    setTimeout(function(){
      S.verify={letter:letter,phase:'done',hit:S.hit};
      toast(letter+' 已加速 · 命中率 '+Math.round(S.hit)+'%','ok');
      render();
    },1600);
  }
}
function batchAccel(){
  if(S.attaching) return;
  S.volumes.forEach(function(v){ if(!v.sys) S.attached[v.letter]=true; });
  setCh(8,'ok','2.2 ms','刚刚');
  toast('已对非系统盘开启加速（直写）','ok'); render();
}

             {letter:'C:',label:'系统盘',cap:'476 GB',sys:true,bound:true}];
  S.attached={'D:':true,'F:':true,'C:':false};
  S.mode={'D:':0,'F:':1,'C:':0};
  S.safeMode=false; S.panic=false; S.settling=false; S.dirty=620; S.lost=0;
  S.statsOk=true; S.verify=null; S.retrying=false; S.pollFail=0;
  S.flushFail=false; S.attaching=false;
  S.ch.forEach(function(m){ m.st='mut'; m.lat='—'; m.t='未调用'; m.err=''; });
  setCh(1,'ok','0.8 ms','刚刚'); setCh(4,'ok','0.6 ms','启动时'); setCh(7,'ok','1.1 ms','刚刚');
  setCh(9,'ok','2.4 ms','进页时'); setCh(10,'ok','0.5 ms','启动握手');

  switch(k){
    case 'normal': break;
    case 'notinstalled': S.installed=false; S.connErr='notfound'; S.volumes.forEach(function(v){v.bound=false;}); S.attached={'D:':false,'F:':false,'C:':false}; setCh(10,'bad','—','失败'); break;
    case 'bound': S.volumes.forEach(function(v){v.bound=false;}); S.attached={'D:':false,'F:':false,'C:':false}; break;
    case 'ready': S.attached={'D:':false,'F:':false,'C:':false}; break;
    case 'through': S.mode={'D:':0,'F:':0,'C:':0}; break;
    case 'back': S.mode={'D:':0,'F:':1,'C:':0}; break;
    case 'safemode': S.safeMode=true; S.mode={'D:':0,'F:':0,'C:':0}; S.attached={'D:':true,'F:':true,'C:':false}; break;
    case 'panic': S.panic=true; S.settling=false; S.dirty=0; setCh(11,'ok','1.2 ms','刚刚'); break;
    case 'heal': S.panic=true; S.settling=true; S.dirty=620; setCh(11,'ok','1.2 ms','刚刚'); setCh(12,'warn','0.9 ms','刚刚','0xC00000A3'); break;
    case 'statsfail': S.statsOk=false; setCh(1,'warn','—','采样超时','Win32 170'); S.retrying=true; S.pollFail=3; break;
    case 'protocol': S.protocolOk=false; setCh(10,'bad','0.5 ms','失败','Win32 87'); break;
    case 'flushfail': S.flushFail=true; S.dirty=620; setCh(3,'bad','—','失败','0xC0000001'); break;
    case 'access': S.installed=false; S.connErr='access'; S.volumes.forEach(function(v){v.bound=false;}); S.attached={'D:':false,'F:':false,'C:':false}; setCh(10,'bad','—','失败','Win32 5'); break;
    case 'attaching': S.attaching=true; S.attached={'D:':false,'F:':true,'C:':false}; setCh(8,'warn','—','重试中','Win32 170'); break;
    case 'loading': S.loading=true; break;
  }
  render();
}

/* ════════════ 启动 ════════════ */
setDemo('normal');
// 轻量轮询演示：仅刷新延迟数值与累计值，避免数字剧烈跳动
setInterval(function(){
  if(!S.installed||S.panic||S.loading||S.attaching) return;
  var lat=(0.6+Math.random()*0.6).toFixed(1);
  setCh(1,'ok',lat+' ms','刚刚');
  S.savedGB=Math.min(99.9,S.savedGB+0.1);
  renderStatus(); renderNav(); paint(false);
}, 3000);
</script>
