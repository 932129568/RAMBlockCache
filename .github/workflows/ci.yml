# RAMBlockCache CI —— 六门禁 + .NET 10 编译 + Web 类型检查/构建（2026-11-06 修订）
#
# 范围纪律：
#  - 六门禁在本工作流原样执行；任何一道 FAIL 即红灯（验收：故意注入协议字段漂移必须红）。
#  - C# 13/13 测试与 WPF 离屏渲染取证（--capture-wpf）需要 STA 渲染环境，
#    hosted runner 上不稳定，继续留在本地 QA（qa_recovery_20261024.ps1）；CI 只做编译级检查。
#  - web/ 自 2026-11-06 起接入：npm ci + tsc（主/bridge 双 tsconfig）+ vite build。
#    工具链契约固定 Node 27 + npm 12.2.1（用户决策）。但 actions/setup-node 的
#    版本清单尚未收录 27.x（alpha 未发布到该通道），因此 CI 用 Node 22 只做
#    **编译级兼容检查**；真实构建与分发由 src/scripts/build_setup.ps1 的
#    Resolve-Node27 强制 27+12.2.1，并把 node.exe 与整个 npm 目录打进安装包。
#    下面的 check_node_contract.py 会断言该 pin 与内置逻辑没有被改回去。
#  - PYTHONIOENCODING / PYTHONUTF8 必填：windows-latest 上 Python stdout 是 charmap(cp1252)，
#    门禁脚本的中文输出会抛 UnicodeEncodeError -> Gate2 假红
#    （2026-11-06 四次 push 实测 failure，日志 check_proto_sync.py:277）。
#  - Gate6 依赖仓库内 dist/RAMBlockCache.sys（哈希由 <sys>.sha256 与三锚点自证）；
#    Authenticode 链要 Valid 需信任 RAMBoostFS 测试根，故先把 certs/*.cer 的
#    **公钥**导入 runner 的 CurrentUser\Root（无私钥、不改仓库、本机门禁⑤仍是权威）。
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: "1"

jobs:
  gates:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Trust release signing root (public cert only)
        shell: pwsh
        run: |
          # 纯 .NET 导入，避免依赖 PS 5.1 的 PKIClient 模块（pwsh 7 上不保证可用）
          $cer = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new('certs/RAMBoostFS-Root.cer')
          $store = [System.Security.Cryptography.X509Certificates.X509Store]::new('Root', 'CurrentUser')
          $store.Open('ReadWrite')
          $store.Add($cer)
          $store.Close()
          "sys signature on runner: $((Get-AuthenticodeSignature dist/RAMBlockCache.sys).Status)"

      # —— 门禁① 版本单一事实源 + 接线表 + mtime ——
      # 干净 checkout 无 build/*.out|obj 时 §7 freshness 按设计跳过（本机等价复现 PASS）。
      - name: Gate1 check_repo
        run: python src/scripts/check_repo.py

      # —— 门禁② 协议三副本字段级同步（注入漂移即红灯的验收载体）——
      - name: Gate2 check_proto_sync
        run: python src/scripts/check_proto_sync.py --strict

      # —— 门禁③ 引用计数模型（17 断言）——
      - name: Gate3 refcount_model
        run: python deliverables/gstack/model/refcount_model.py

      # —— 门禁④ XAML StaticResource 全有定义 ——
      - name: Gate4 check_xaml_resources
        run: python src/scripts/check_xaml_resources.py

      # —— 门禁⑤ PowerShell 语法/BOM/惯用法（全部活跃 .ps1，当前 54 文件）——
      - name: Gate5 check_ps_syntax
        shell: pwsh
        run: ./src/scripts/check_ps_syntax.ps1

      # —— 门禁⑥ 签名有效性 + 三锚点一致 ——
      - name: Gate6 check_signature
        shell: pwsh
        run: ./src/scripts/check_signature.ps1

      # —— 工具链契约：Node 27 + npm 12.2.1 固定 + 安装包全内置（防回退到 22）——
      - name: Assert Node 27 / npm 12.2.1 toolchain contract
        run: python src/scripts/check_node_contract.py

      # —— Web 类型检查 + 生产构建（41 号 §11.5 阶段 2 接入）——
      # --loglevel=error 抑制 Node 27 alpha 上 npm 12.2.1 的已知 engines 假警告
      # （CI 侧同时抑制 Node 22 与 package.json engines 的 EBADENGINE 提示）。
      - name: Web typecheck + build
        working-directory: web
        run: |
          npm ci --no-audit --no-fund --loglevel=error
          npm run build --loglevel=error

      # —— .NET 10 编译检查（0 警告基线）——
      - name: Build WPF (net10.0-windows)
        run: dotnet build src/ui/controller/RAMBlockCache.Controller/RAMBlockCache.Controller.csproj -c Release --no-incremental -warnaserror
