<!-- RAMBlockCache 导航线描图标集 V1.0（24×24 视窗，stroke=1.8，round cap/join，仅令牌色）
     用法：XAML 中以 Path Data 内联或 Geometry 资源引用；fill="none"，色由父级 Foreground 提供。
     原型 HTML 侧用 <svg viewBox="0 0 24 24"> 直接内联。 -->
<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <!-- 状态（首页）：仪表盘指针 -->
  <symbol id="i-dash" viewBox="0 0 24 24">
    <path d="M4 18a8 8 0 1 1 16 0" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="12" y1="18" x2="16.2" y2="11.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="12" cy="18" r="1.6" fill="currentColor"/>
    <line x1="4" y1="21" x2="20" y2="21" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
  </symbol>

  <!-- 加速：闪电（与产品图标语义呼应） -->
  <symbol id="i-boost" viewBox="0 0 24 24">
    <path d="M13 3 6.5 13.5h4.2L10 21l6.8-11h-4.3L14.6 3z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
  </symbol>

  <!-- 收益：上升趋势 -->
  <symbol id="i-gain" viewBox="0 0 24 24">
    <path d="M4 17l5-5 3.5 3.5L20 8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M14.5 8H20v5.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

  <!-- 诊断：听诊/脉冲 -->
  <symbol id="i-diag" viewBox="0 0 24 24">
    <path d="M3.5 12h4l2-5 3.5 10 2.5-5h5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

  <!-- 应急：盾牌 + 叹号 -->
  <symbol id="i-rescue" viewBox="0 0 24 24">
    <path d="M12 3l7 2.8v5.4c0 4.6-3 8-7 9.8-4-1.8-7-5.2-7-9.8V5.8z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
    <line x1="12" y1="8.5" x2="12" y2="13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="12" cy="15.8" r="1.1" fill="currentColor"/>
  </symbol>

  <!-- 设置：滑杆 -->
  <symbol id="i-settings" viewBox="0 0 24 24">
    <line x1="4" y1="8"  x2="20" y2="8"  stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="4" y1="16" x2="20" y2="16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="14.5" cy="8"  r="2.4" fill="none" stroke="currentColor" stroke-width="1.8"/>
    <circle cx="9"    cy="16" r="2.4" fill="none" stroke="currentColor" stroke-width="1.8"/>
  </symbol>

  <!-- 状态条四段小图标（可选，12×12 场景用同 stroke） -->
  <symbol id="i-drive" viewBox="0 0 24 24">
    <rect x="4" y="7" width="16" height="10" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/>
    <circle cx="16.2" cy="12" r="1.2" fill="currentColor"/>
  </symbol>
  <symbol id="i-stack" viewBox="0 0 24 24">
    <rect x="5" y="5"  width="14" height="5" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/>
    <rect x="5" y="14" width="14" height="5" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/>
  </symbol>
</svg>
