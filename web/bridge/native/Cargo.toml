[package]
name = "rb_native"
version = "0.1.0"
edition = "2021"
description = "RAMBlockCache Web 桥接原生插件（路径 B：Node 直接 DeviceIoControl）"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", default-features = false, features = ["napi4"] }
napi-derive = "3"

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
strip = "symbols"
